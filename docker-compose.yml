services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sanctions
      POSTGRES_PASSWORD: sanctions
      POSTGRES_DB: sanctions_delta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanctions -d sanctions_delta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
